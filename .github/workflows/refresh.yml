name: Refresh snapshot

# Keeps the season baked into index.html current, so a fresh clone (or an
# offline visitor) sees recent results without waiting on a live fetch.
on:
  schedule:
    - cron: "17 9 * * *"   # daily, after the previous night's matches
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-snapshot.mjs
      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain index.html)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Refresh embedded snapshot"
            git push
          else
            echo "No change."
          fi
